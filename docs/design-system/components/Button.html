<!-- @dsCard group="Actions" height=120 subtitle="primary · outline · ghost · danger" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="sy-stack" style="padding:var(--space-5)">
  <div class="sy-row">
    <button class="sy-btn sy-btn--primary"><svg class="sy-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2.5M5 5.5l3-3 3 3"/><path d="M2.5 10v2.5a1 1 0 001 1h9a1 1 0 001-1V10"/></svg>Publish</button>
    <button class="sy-btn sy-btn--outline">Copy run command</button>
    <button class="sy-btn sy-btn--ghost">Cancel</button>
    <button class="sy-btn sy-btn--danger">Overwrite</button>
    <button class="sy-btn sy-btn--danger-outline">Discard changes</button>
  </div>
  <div class="sy-row">
    <button class="sy-btn sy-btn--primary sy-btn--lg">Write 4 files</button>
    <button class="sy-btn sy-btn--primary sy-btn--sm"><svg class="sy-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>New agent</button>
    <button class="sy-btn sy-btn--outline sy-btn--sm">Apply</button>
    <button class="sy-btn sy-btn--primary" disabled>Write 4 files</button>
  </div>
</div>
</body>
</html>
