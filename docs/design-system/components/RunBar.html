<!-- @dsCard group="Patterns" height=96 subtitle="live run" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RunBar</title></head>
<body>
<div style="padding:var(--space-5)"><div class="sy-runbar" role="status">
  <span class="sy-glyph sy-glyph--running" data-live="true" role="img" aria-label="running">◉</span>
  <span class="sy-runbar__name">/ship</span><span class="sy-runbar__meta">step 3 of 5 · 01:42 · 18.2k tok</span>
  <span class="sy-progress"><span style="width:58%"></span></span>
  <button class="sy-btn sy-btn--ghost sy-btn--sm">Agents</button>
  <button class="sy-btn sy-btn--outline sy-btn--sm"><svg class="sy-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.5"/></svg>Cancel</button>
</div></div>
</body>
</html>
