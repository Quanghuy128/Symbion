<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>SegmentedControl</title></head>
<body>
<div class="sy-stage">
  <div class="sy-seg" role="radiogroup" aria-label="Create">
    <button role="radio" aria-checked="true"><svg class="sy-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2.5L6 13.5"/></svg>Workflow</button>
    <button role="radio" aria-checked="false"><svg class="sy-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="5" width="10" height="8" rx="2"/><path d="M8 2.5V5M6 9h.01M10 9h.01"/></svg>Agent</button>
  </div>
  <div class="sy-seg" role="radiogroup" aria-label="View">
    <button role="radio" aria-checked="false">List</button>
    <button role="radio" aria-checked="true">Graph</button>
  </div>
  <div class="sy-seg" role="radiogroup" aria-label="Appearance">
    <button role="radio" aria-checked="false">Light</button>
    <button role="radio" aria-checked="true">Dark</button>
    <button role="radio" aria-checked="false">System</button>
  </div>
</div>
</body>
</html>
