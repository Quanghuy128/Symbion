<!-- @dsCard group="Status" height=96 subtitle="run states" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusGlyph</title></head>
<body>
<div class="sy-stage" style="gap:18px">
  <span class="sy-row"><span class="sy-glyph sy-glyph--running" data-live="true" role="img" aria-label="running">◉</span>running</span>
  <span class="sy-row"><span class="sy-glyph sy-glyph--starting" role="img" aria-label="starting">◌</span>starting</span>
  <span class="sy-row"><span class="sy-glyph sy-glyph--done" role="img" aria-label="done">✓</span>done</span>
  <span class="sy-row"><span class="sy-glyph sy-glyph--error" role="img" aria-label="error">✗</span>error</span>
  <span class="sy-row"><span class="sy-glyph sy-glyph--pending" role="img" aria-label="pending">○</span>pending</span>
  <span class="sy-row"><span class="sy-glyph sy-glyph--interrupted" role="img" aria-label="interrupted">◼</span>interrupted</span>
  <span class="sy-row"><span class="sy-glyph sy-glyph--thinking" role="img" aria-label="thinking">·</span>thinking</span>
</div>
</body>
</html>
