<!-- @dsCard group="Feedback" height=190 subtitle="success · warning · error" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div class="sy-stack" style="padding:var(--space-5)">
  <div class="sy-toast sy-toast--success" role="status"><span class="sy-toast__icon">✓</span>Published 4 files to symbion-demo</div>
  <div class="sy-toast sy-toast--warning" role="status"><span class="sy-toast__icon">!</span>Codex export drops 2 tool permissions</div>
  <div class="sy-toast sy-toast--error" role="alert"><span class="sy-toast__icon">✕</span><span style="flex:1">Couldn't reach the daemon. Run <span class="sy-mono">symbion</span> again.</span><button class="sy-btn sy-btn--ghost sy-btn--sm">Retry</button></div>
</div>
</body>
</html>
